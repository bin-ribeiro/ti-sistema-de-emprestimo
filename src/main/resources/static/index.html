<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema de Empréstimos</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Sistema de Empréstimo</h1><section id="login"><h2>Login</h2><label>Usuário<input id="usuario" value="admin"></label><label>Senha<input id="senha" type="password" value="admin123"></label><button onclick="login()">Entrar</button></section><section id="app" hidden><nav><button onclick="listarEquipamentos()">Equipamentos</button><button onclick="listarEmprestimos(false)">Empréstimos</button><button onclick="listarEmprestimos(true)">Atrasados</button><button onclick="logout()">Sair</button></nav><h2>Novo equipamento</h2><form id="fe"><input id="patrimonio" placeholder="Patrimônio" required><input id="nomeEq" placeholder="Nome" required><select id="tipo"><option>NOTEBOOK</option><option>MONITOR</option><option>HEADSET</option><option>TECLADO</option><option>MOUSE</option><option>OUTRO</option></select><button>Cadastrar</button></form><h2>Novo colaborador</h2><form id="fc"><input id="nomeCol" placeholder="Nome" required><input id="email" type="email" placeholder="E-mail" required><input id="cep" placeholder="CEP com 8 dígitos" required><input id="numero" placeholder="Número" required><button>Cadastrar</button></form><h2>Novo empréstimo</h2><form id="fm"><input id="equipamentoId" type="number" placeholder="ID equipamento" required><input id="colaboradorId" type="number" placeholder="ID colaborador" required><button>Emprestar</button></form><div id="msg" aria-live="polite"></div><pre id="saida"></pre></section></main><script src="app.js"></script></body></html>
